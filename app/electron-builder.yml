appId: com.rabah.locum
productName: Locum

directories:
  # O padrão do electron-builder é `dist`, que aqui já é a saída do esbuild e
  # do Vite. Sem mudar isto, o pacote sobrescreveria o que ele está embrulhando.
  output: release
  # `build/` também é onde o `icon.icns` mora, e é dali que ele é encontrado
  # sozinho, sem precisar de `mac.icon`.
  buildResources: build

# O que o pacote leva além do que o electron-builder já traz de node_modules.
# `src/`, `electron/`, `renderer/` e `scripts/` ficam de fora: o esbuild e o
# Vite já embutiram o que roda, e código-fonte dentro do `.app` só engorda o
# download.
files:
  - dist/**
  - native/**
  - locales/**
  - drizzle/**
  - package.json
  # Os agents prontos do marketplace são dados, e não código: o processo
  # principal os lê do disco em runtime (`agents.templates`), sem import
  # estático. Um template novo no catálogo não é razão de release.
  - "../examples/agents/*.json"
  # Mapa de origem so serve para quem tem o codigo, e quem tem o codigo roda
  # por `npm run start`. No pacote sao mais de cinco mil arquivos que ninguem
  # abre, e o download dobra de tamanho por causa deles.
  - "!dist/**/*.map"
  # `node_modules` inteiro fica de fora, e o que roda vem embutido em
  # `dist/main.cjs`. Por padrao o electron-builder embrulha toda a arvore de
  # producao, e a maior parte dela nao serve para nada dentro do `.app`: o
  # React, o Shiki e o Radix ja foram embutidos pelo Vite na pagina da janela,
  # e viajavam de novo em codigo-fonte; o Octokit sozinho passava de cem
  # megabytes. O `external` do esbuild em `scripts/build-main.mjs` e o outro
  # lado desta linha, e mexer num sem o outro quebra a subida.
  - "!node_modules/**"
  # A excecao e o invólucro JS do better-sqlite3, que o bundle nao embute
  # porque ele faz `require` de caminho para chegar no binario nativo. So
  # `lib/` e o `package.json` entram: `deps/`, `src/` e `binding.gyp` sao o
  # fonte do SQLite, que serve para compilar e nunca e lido em execucao, e
  # `build/` e a copia compilada para o ABI do Node, que o Electron recusa. A
  # copia que vale e a de `native/`, apontada por `LOCUM_SQLITE_BINDING`.
  - node_modules/better-sqlite3/package.json
  - node_modules/better-sqlite3/lib/**
  - node_modules/node-pty/package.json
  - node_modules/node-pty/lib/**
  - "!node_modules/node-pty/lib/**/*.test.js"
  - node_modules/node-pty/prebuilds/darwin-*/**

# O Electron traz 220 traduções do Chromium, e a interface do Locum existe em
# duas. As outras 218 são o menu de contexto e o corretor ortográfico em idioma
# que o aplicativo não fala: o dicionário em `locales/` tem `en` e `pt-BR`, e
# qualquer outro sistema já cai em `en`. Deixá-las de fora alinha o que o
# macOS anuncia como idioma do aplicativo com o que ele de fato responde.
#
# Os nomes aqui sao os das pastas `.lproj` do Electron, e nao as etiquetas BCP
# 47 do dicionario: esta versao do electron-builder compara o nome do arquivo
# em minusculas, entao `pt-BR` nao casa com `pt_BR.lproj` e apaga a traducao
# que a gente queria manter. O estrago e silencioso, porque o macOS decide o
# idioma do aplicativo pelos `.lproj` que sobraram: sem `pt_BR`, o
# `app.getLocale()` devolve `en` mesmo em sistema em portugues, e a interface
# inteira troca de idioma.
electronLanguages:
  - en
  - pt_BR

# O binário do better-sqlite3 precisa sair do asar. O asar é um arquivo só, e
# `require` de módulo nativo passa pelo `dlopen` do sistema, que não enxerga
# caminho lá dentro. O Electron desempacota o que está aqui para
# `app.asar.unpacked`, e o processo principal aponta para lá.
asar: true
asarUnpack:
  - native/**
  - node_modules/node-pty/prebuilds/**
  # O servidor de brinquedo sobe como processo filho, fora do Electron, e o
  # `fs` remendado que enxerga dentro do asar nao vale para ele.
  - dist/mcp-fixture-server.mjs

# O electron-builder reconstruiria o better-sqlite3 de `node_modules` para o
# ABI do Electron, e é justamente o que não se quer: a linha de comando roda
# por tsx, no Node do sistema, e ficaria sem banco. O build do processo
# principal já resolve isso guardando uma segunda cópia em `native/`.
npmRebuild: false

mac:
  category: public.app-category.productivity
  # Sem certificado da Apple: assinatura e notarização dependem de conta de
  # desenvolvedor, que é decisão do dono do repositório. "-" é assinatura
  # ad-hoc do bundle inteiro. Sem ela só o binário principal saía assinado (pelo
  # linker), o selo do bundle não fechava, e num Mac que baixou o dmg o
  # Gatekeeper dizia "danificado", sem saída pela tela. Assinado, o aviso vira
  # "não verificado", que abre por Ajustes > Privacidade e Segurança.
  identity: "-"
  # Runtime endurecido com assinatura ad-hoc barra o carregamento do módulo
  # nativo do SQLite, que não tem a mesma assinatura do app.
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

# O `setAsDefaultProtocolClient` do M3.7 basta rodando do código, mas o
# aplicativo instalado é registrado pelo Info.plist: sem esta entrada o
# `locum://` do retorno de OAuth não chegaria ao app já fechado.
protocols:
  - name: Locum
    schemes:
      - locum
